name = "emdomanus/hook"
version = "0.1.1"
description = "A tiny low-overhead id-based subscriber list for Roblox."
license = "MIT"
authors = ["emdomanus"]
repository = "https://github.com/emdomanus/hook"

includes = [
	"pesde.toml",
	"LICENSE",
	"README.md",
	"src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
